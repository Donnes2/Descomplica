<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pierri AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-3 pb-10">

  <header class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-3 mb-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-bold">P</div>
      <div>
        <h1 class="text-sm font-bold">Pierri<span class="text-emerald-400">AI</span> <span id="badge" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">Ativo</span></h1>
        <p class="text-[10px] text-slate-400">Copiloto Financeiro</p>
      </div>
    </div>
    <div class="flex gap-1.5">
      <button type="button" onclick="configSB()" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-xl">☁️ Nuvem</button>
      <button type="button" onclick="clearTx()" class="text-xs bg-rose-500/20 text-rose-400 px-2.5 py-1.5 rounded-xl">Limpar</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto space-y-3">
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <span class="text-[10px] text-slate-400 block">Saldo</span>
        <b id="bal" class="text-sm text-white">R$ 0,00</b>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <span class="text-[10px] text-emerald-400 block">Entradas</span>
        <b id="inc" class="text-sm text-emerald-400">R$ 0,00</b>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <span class="text-[10px] text-rose-400 block">Saídas</span>
        <b id="exp" class="text-sm text-rose-400">R$ 0,00</b>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
      <h2 class="text-xs font-bold text-slate-300 mb-2">Despesas por Categoria</h2>
      <div class="h-36"><canvas id="chart"></canvas></div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
      <h2 class="text-xs font-bold text-slate-300 mb-2">Extrato Recente</h2>
      <div id="list" class="space-y-1.5 max-h-44 overflow-y-auto"></div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-80">
      <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
        <span class="text-xs font-bold text-emerald-400">● Copiloto Financeiro</span>
        <span id="mic-st" class="hidden text-[10px] text-rose-400 font-bold">🎤 Ouvindo...</span>
      </div>
      <div id="chat" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
        <div class="bg-slate-800 p-2.5 rounded-xl text-slate-200">
          Toque nos botões abaixo ou digite: <b>"Gastei 45 no almoço"</b> ou <b>"Recebi 1200"</b>.
        </div>
      </div>
      <div class="px-2 py-1.5 bg-slate-950 border-t border-slate-800 flex gap-1.5 overflow-x-auto text-[11px] whitespace-nowrap">
        <button type="button" onclick="send('Gastei 45 no almoço')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg">🍽️ +Gasto R$ 45</button>
        <button type="button" onclick="send('Gastei 120 no mercado')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg">🛒 +Mercado R$ 120</button>
        <button type="button" onclick="send('Recebi 500 de freela')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg">💰 +Receita R$ 500</button>
        <button type="button" onclick="send('Qual meu saldo?')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg">📊 Ver Saldo</button>
      </div>
      <form onsubmit="sub(event)" class="p-2 bg-slate-950 border-t border-slate-800 flex gap-1.5">
        <button type="button" onclick="voice()" class="px-3 py-2 bg-slate-800 rounded-xl border border-slate-700">🎤</button>
        <input id="msg" type="text" placeholder="Fale ou digite..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
        <button type="submit" class="px-3 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Enviar</button>
      </form>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(r => r.forEach(sw => sw.unregister()));
    }

    var sb = null, chart = null;
    var txs = JSON.parse(localStorage.getItem('pierri_v3')) || [
      { id: 1, desc: 'Salário', val: 3200, type: 'in', cat: 'Renda' },
      { id: 2, desc: 'Supermercado', val: 420, type: 'out', cat: 'Mercado' },
      { id: 3, desc: 'Combustível', val: 150, type: 'out', cat: 'Transporte' }
    ];

    function brl(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

    function render() {
      localStorage.setItem('pierri_v3', JSON.stringify(txs));
      var inc = 0, exp = 0, cats = {};
      txs.forEach(function(t) {
        if (t.type === 'in') inc += Number(t.val);
        else { exp += Number(t.val); cats[t.cat] = (cats[t.cat] || 0) + Number(t.val); }
      });
      document.getElementById('bal').textContent = brl(inc - exp);
      document.getElementById('inc').textContent = brl(inc);
      document.getElementById('exp').textContent = brl(exp);

      document.getElementById('list').innerHTML = txs.slice().reverse().map(function(t) {
        return '<div class="flex justify-between items-center p-2 bg-slate-950 rounded-lg border border-slate-800 text-xs">' +
          '<div><b>' + t.desc + '</b> <span class="text-[10px] text-slate-400">(' + t.cat + ')</span></div>' +
          '<div class="flex items-center gap-2"><b class="' + (t.type === 'in' ? 'text-emerald-400' : 'text-rose-400') + '">' +
          (t.type === 'in' ? '+' : '-') + brl(t.val) + '</b>' +
          '<button onclick="delTx(' + t.id + ')" class="text-slate-400 px-1">✕</button></div></div>';
      }).join('') || '<p class="text-xs text-slate-500 text-center py-3">Sem lançamentos</p>';

      try {
        if (window.Chart) {
          if (chart) chart.destroy();
          var k = Object.keys(cats);
          chart = new Chart(document.getElementById('chart'), {
            type: 'doughnut',
            data: { labels: k.length ? k : ['Sem gastos'], datasets: [{ data: k.length ? Object.values(cats) : [1], backgroundColor: ['#10b981','#f43f5e','#3b82f6','#f59e0b','#8b5cf6'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8', boxWidth: 10, font: { size: 10 } } } }, cutout: '65%' }
          });
        }
      } catch (e) {}
    }

    function delTx(id) { txs = txs.filter(function(t) { return t.id !== id; }); render(); }
    function clearTx() { if (confirm('Limpar extrato?')) { txs = []; render(); } }

    function addMsg(txt, u) {
      var c = document.getElementById('chat');
      c.innerHTML += '<div class="' + (u ? 'bg-emerald-600 text-white ml-auto' : 'bg-slate-800 text-slate-200 mr-auto') + ' p-2 rounded-xl max-w-[85%]">' + txt + '</div>';
      c.scrollTop = c.scrollHeight;
    }

    function send(txt) {
      addMsg(txt, true);
      if (/saldo|quanto/i.test(txt)) return addMsg('📊 Saldo atual: <b>' + document.getElementById('bal').textContent + '</b>', false);
      var m = txt.match(/(\d+(?:[.,]\d{1,2})?)/);
      if (!m) return addMsg('Digite um número. Ex: "Gastei 45 no almoço"', false);
      var val = parseFloat(m[1].replace(',', '.'));
      var isIn = /recebi|ganhei|sal[aá]rio|freela|pix/i.test(txt);
      var cat = isIn ? 'Renda' : (/almo[cç]o|jantar|lanche|caf[eé]|comida|ifood/i.test(txt) ? 'Alimentação' : (/mercado|compras/i.test(txt) ? 'Mercado' : (/gasolina|uber|posto/i.test(txt) ? 'Transporte' : 'Geral')));
      txs.push({ id: Date.now(), desc: cat, val: val, type: isIn ? 'in' : 'out', cat: cat });
      render();
      addMsg('✓ Lançado: <b>' + cat + '</b> — <b>' + brl(val) + '</b>', false);
    }

    function sub(e) {
      e.preventDefault();
      var i = document.getElementById('msg');
      if (i.value.trim()) { send(i.value.trim()); i.value = ''; }
    }

    function voice() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Navegador sem suporte a voz.');
      var r = new SR();
      r.lang = 'pt-BR';
      r.onstart = function() { document.getElementById('mic-st').classList.remove('hidden'); };
      r.onend = function() { document.getElementById('mic-st').classList.add('hidden'); };
      r.onresult = function(e) { send(e.results[0][0].transcript); };
      r.start();
    }

    function configSB() {
      var u = prompt('URL do Supabase:', localStorage.getItem('sb_u') || '');
      if (u) localStorage.setItem('sb_u', u.trim());
    }

    render();
  </script>
</body>
</html>
