<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pierri Finance AI</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PierriAI">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9181/9181081.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 900: '#064e3b' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Barra Superior -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      
      <!-- Logótipo e Estado -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm md:text-base font-bold text-white tracking-tight">Pierri<span class="text-emerald-400">AI</span></h1>
            <span id="auth-status-badge" class="text-[9px] bg-slate-800 text-slate-400 border border-slate-700 px-1.5 py-0.5 rounded-full flex items-center gap-1 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Modo Local
            </span>
          </div>
          <p id="user-display-email" class="text-[11px] text-slate-400 truncate max-w-[150px] sm:max-w-xs">Modo local</p>
        </div>
      </div>
      
      <!-- Ações -->
      <div class="flex items-center gap-1.5">
        <button id="tts-toggle-btn" onclick="toggleSpeechSynthesis()" title="Leitura de Respostas por Voz" class="p-2 text-slate-400 hover:text-white bg-slate-800/80 border border-slate-700 rounded-xl transition-all">
          <i data-lucide="volume-2" id="tts-icon" class="w-4 h-4 text-emerald-400"></i>
        </button>

        <button onclick="toggleConfigModal()" title="Configurar Base de Dados" class="p-2 text-slate-400 hover:text-white bg-slate-800/80 border border-slate-700 rounded-xl transition-all">
          <i data-lucide="database" class="w-4 h-4 text-emerald-400"></i>
        </button>

        <button onclick="exportCSV()" title="Exportar CSV" class="p-2 text-slate-400 hover:text-white bg-slate-800/80 border border-slate-700 rounded-xl transition-all">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>

        <button id="auth-main-btn" onclick="openAuthModal()" class="flex items-center gap-1 text-xs bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-xl hover:bg-emerald-400 transition-colors">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span>Entrar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Modal de Autenticação -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
          </div>
          <h3 id="auth-modal-title" class="text-sm font-bold text-white">Aceder à Conta</h3>
        </div>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="flex border-b border-slate-800 text-xs font-semibold">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-2 text-emerald-400 border-b-2 border-emerald-500">Entrar</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 pb-2 text-slate-400 hover:text-slate-200">Criar Conta</button>
      </div>

      <div id="auth-alert" class="hidden text-xs p-2.5 rounded-xl border"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-300 block
